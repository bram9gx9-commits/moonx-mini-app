  <script>  
async function moonxRequest(action = "connect") {
  const response = await fetch(
    "https://vyxknnybolontvexpoua.supabase.co/functions/v1/moonx-api",
    {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        action: action,
        initData: tg.initData
      })
    }
  );

  return await response.json();
}

async function loadBalance() {
  try {
    const data = await moonxRequest("connect");

    if (data.success) {
      document.getElementById("balance").textContent = data.balance;
    }
  } catch (error) {
    console.error("Connection error:", error);
  }
}

async function farm() {
  const button = document.getElementById("farmBtn");
  const timer = document.getElementById("timer");

  button.disabled = true;
  timer.textContent = "Farming...";

  try {
    const data = await moonxRequest("farm");

    if (data.success) {
      document.getElementById("balance").textContent = data.balance;
      timer.textContent = "+10 MOONX 🎉";
    } else {
      timer.textContent =
        "Wait " + data.hours + "h " + data.minutes + "m ⏳";
    }
  } catch (error) {
    console.error("Farm error:", error);
    timer.textContent = "Error ❌";
  }

  button.disabled = false;
}

loadBalance();
</script>
